<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1b423f"><title>英语听力练习</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f4ee;color:#213c39;font:16px/1.55 system-ui,-apple-system,sans-serif}header{background:#1b423f;color:#fff;padding:38px 20px 46px}header>div,main{max-width:850px;margin:auto}.eyebrow{font-size:12px;letter-spacing:.18em;color:#b9d8c5;font-weight:700}h1{font-size:clamp(30px,7vw,48px);margin:9px 0 4px;letter-spacing:-.04em}header p{color:#d6e5db;margin:0}main{padding:0 16px 60px}.player{background:#fff;border-radius:18px;padding:22px;box-shadow:0 10px 35px #1b423f1a;margin-top:-24px;position:relative}.label{font-size:12px;color:#718681;letter-spacing:.12em;font-weight:700}.now{font-size:21px;font-weight:700;margin:5px 0 12px}audio{width:100%;height:42px}section{margin-top:36px}.heading{display:flex;align-items:baseline;justify-content:space-between;gap:10px}h2{font-size:21px;margin:0}.hint{font-size:13px;color:#6a7d77}.tracks{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}.track{border:1px solid #dce5dd;background:#fff;color:#24433f;text-align:left;border-radius:12px;padding:14px;display:flex;align-items:center;gap:12px;font:inherit;cursor:pointer}.track:hover,.track.active{border-color:#4c8b71;background:#edf6ee}.number{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:#e4eee4;color:#346b58;font-size:13px;flex:none}.track strong{display:block;font-size:15px}.track small{display:block;color:#7b8e86}.documents{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}.documents a{display:block;border:1px solid #dce5dd;background:white;color:#24433f;text-decoration:none;padding:16px;border-radius:12px}.documents a span{display:block;color:#83938c;font-size:12px;margin-top:3px}.foot{font-size:13px;color:#71837b;margin-top:30px}@media(max-width:520px){header{padding-top:30px}.tracks,.documents{grid-template-columns:1fr}.track{padding:12px}section{margin-top:30px}}
.reader{position:fixed;inset:0;z-index:100;background:#eef2ed;display:flex;flex-direction:column}.reader[hidden]{display:none}.reader-bar{display:flex;align-items:center;gap:12px;padding:10px 14px;background:#1b423f;color:white;flex:none}.reader-bar button{border:0;background:#fff;color:#1b423f;border-radius:8px;padding:9px 12px;font:inherit}.reader-bar strong{font-size:16px}.reader iframe{display:block;width:100%;flex:1;border:0;background:#eef2ed;min-height:0}</style></head><body><header><div><div class="eyebrow">ENGLISH LISTENING · STUDY ROOM</div><h1>英语听力练习</h1><p>选择一段录音，随时开始练习。</p></div></header><main><div class="player"><div class="label">正在播放 NOW PLAYING</div><div class="now" id="now">请选择一段录音</div><audio id="audio" controls preload="none"></audio></div><section><div class="heading"><h2>模拟题听力</h2><span class="hint">10 段录音</span></div><div class="tracks" id="tracks"></div></section><section><div class="heading"><h2>英语 B 考试样题</h2><span class="hint">录音与配套资料</span></div><div class="tracks" id="exam"></div><div class="documents"><a href="试题.pdf">考试试题 <span>PDF ↗</span></a><a href="答案与听力文字.pdf">答案与听力文字 <span>PDF ↗</span></a><a href="机读答题卡.pdf" target="_blank">机读答题卡 <span>PDF ↗</span></a><a href="主观答题卡.pdf" target="_blank">主观答题卡 <span>PDF ↗</span></a></div></section><p class="foot">播放需要网络；音频按需加载。资料可在浏览器中查看。</p></main><div class="reader" id="reader" hidden><div class="reader-bar"><button id="reader-close" type="button">‹ 返回</button><strong id="reader-title"></strong></div><iframe id="reader-frame" title="资料阅读"></iframe></div><script>
const reader=document.querySelector('#reader'),frame=document.querySelector('#reader-frame'),title=document.querySelector('#reader-title');
const pages=['exam-pages.html','answers-pages.html','card-objective.html','card-subjective.html'];
document.querySelectorAll('.documents a').forEach((a,i)=>{a.href=pages[i];a.removeAttribute('target');a.querySelector('span').textContent='在线阅读 ›';a.addEventListener('click',e=>{e.preventDefault();title.textContent=a.childNodes[0].textContent.trim();reader.hidden=false;document.body.style.overflow='hidden';frame.src=a.href;});});
document.querySelector('#reader-close').addEventListener('click',()=>{reader.hidden=true;frame.removeAttribute('src');document.body.style.overflow='';});
const player=document.querySelector('#audio'),now=document.querySelector('#now');function add(container,title,sub,url,n){const b=document.createElement('button');b.className='track';b.innerHTML=`<span class="number">${n}</span><span><strong>${title}</strong><small>${sub}</small></span>`;b.onclick=()=>{document.querySelectorAll('.track').forEach(x=>x.classList.remove('active'));b.classList.add('active');now.textContent=title;player.src=url;player.play().catch(()=>{});};container.append(b)}for(let i=1;i<=10;i++)add(document.querySelector('#tracks'),`Model Test ${i}`,'模拟题录音',`test${String(i).padStart(2,'0')}.mp3`,String(i).padStart(2,'0'));add(document.querySelector('#exam'),'考试样题录音','英语 B 考试样题','exam.mp3','▶');
</script></body></html>
